org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStoreType=JKS -Dhttps.protocols=TLSv1.2,TLSv1.3
# Compilation has its own bounded heap; do not enlarge Gradle/lint to address Kotlin OOM.
kotlin.daemon.jvmargs=-Xmx3072m
# Retain failure causes without verbose/debug logging or changing verification gates.
org.gradle.logging.stacktrace=all
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
