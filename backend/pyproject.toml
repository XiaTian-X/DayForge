[project]
name = "dayforge-backend"
version = "0.1.0"
description = "Self-hosted synchronization backend for DayForge"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite==0.22.1",
    "alembic==1.14.0",
    "bcrypt==4.2.1",
    "email-validator==2.2.0",
    "fastapi==0.141.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "pyjwt[crypto]==2.13.0",
    "python-multipart==0.0.32",
    "sqlalchemy[asyncio]==2.0.54",
    "sqlmodel==0.0.22",
    "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==6.0.0",
    "ruff==0.16.8",
]

[tool.ruff]
target-version = "py312"
required-version = "==0.16.8"
line-length = 88
indent-width = 4
preview = false

[tool.ruff.format]
# This gate formats Python source, not executable examples in documentation.
exclude = ["*.md"]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = false

[tool.ruff.lint]
# Additional lint rule families are separate #20 batches, not silently
# enabled by formatter adoption or tool upgrades.
select = ["E4", "E9", "F"]

[tool.mypy]
python_version = "3.12"
# Whole backend, including fixtures, operational scripts and Alembic revisions.
# This is gradual checking with untyped bodies checked, not strict annotation coverage.
files = ["src", "tests", "scripts", "alembic"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
show_error_codes = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=src --cov-report=term-missing"

[tool.coverage.run]
concurrency = ["thread", "greenlet"]
